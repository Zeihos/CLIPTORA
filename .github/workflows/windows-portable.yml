name: Windows Portable EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: CLIPTORA.exe · ${{ matrix.edition }}
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        edition: [Core, AI]
    steps:
      - name: Загрузить исходники
        uses: actions/checkout@v4
      - name: Подготовить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Тесты Rust Core
        run: cargo test --locked --manifest-path rust/scanner/Cargo.toml
      - name: Собрать Rust Core
        run: cargo build --locked --release --manifest-path rust/scanner/Cargo.toml
      - name: Установить PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Установить Whisper для AI-сборки
        if: matrix.edition == 'AI'
        run: python -m pip install -r packaging/requirements-portable-ai.txt
      - name: Собрать CLIPTORA.exe
        env:
          CLIPTORA_WITH_AI: ${{ matrix.edition == 'AI' && '1' || '0' }}
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/cliptora.spec
      - name: Проверить запуск настоящего EXE (Core)
        if: matrix.edition == 'Core'
        run: python scripts/smoke_portable.py dist/CLIPTORA/CLIPTORA.exe
      - name: Проверить запуск EXE и нативный Whisper (AI)
        if: matrix.edition == 'AI'
        run: python scripts/smoke_portable.py dist/CLIPTORA/CLIPTORA.exe --expect-whisper
      - name: Добавить лицензию и инструкцию
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/CLIPTORA/LICENSE.txt
          Copy-Item docs/INSTALL_PORTABLE_RU.md dist/CLIPTORA/ПРОЧИТАЙ_ПЕРЕД_ЗАПУСКОМ.md
      - name: Загрузить Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: CLIPTORA-Windows-Portable-${{ matrix.edition }}
          path: dist/CLIPTORA/
          if-no-files-found: error
          retention-days: 14
