name: CLIPTORA CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Rust scanner
        run: cargo test --locked --manifest-path rust/scanner/Cargo.toml
      - name: Build optional Rust scanner
        run: cargo build --release --locked --manifest-path rust/scanner/Cargo.toml
      - name: Verify Python finds native scanner
        run: python -c "import scanner_bridge; assert scanner_bridge.locate_scanner(), 'Rust scanner binary missing'"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
